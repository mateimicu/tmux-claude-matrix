version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - govet         # Examine Go source code and reports suspicious constructs
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # State-of-the-art linter (includes gosimple)
    - unused        # Check for unused constants, variables, functions and types
    - misspell      # Check for misspelled English words
    - revive        # Fast, configurable, extensible, flexible, and beautiful linter
    - unparam       # Reports unused function parameters
    - gocritic      # Provides diagnostics that check for bugs, performance and style issues

  exclusions:
    rules:
      # Exclude some linters from running on test files
      - path: _test\.go
        linters:
          - errcheck
          - unparam
      # Cobra command handlers require specific signatures
      - text: "unused-parameter"
        linters:
          - revive
      # Package comments not required for internal packages
      - text: "package-comments"
        linters:
          - revive
      # pkg/types is an established package name
      - text: "var-naming: avoid meaningless package names"
        path: pkg/types/
        linters:
          - revive

formatters:
  enable:
    - gofmt         # Check whether code was gofmt-ed
    - goimports     # Check import statements are formatted
  settings:
    goimports:
      local-prefixes:
        - github.com/mateimicu/tmux-claude-matrix

linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true

  govet:
    enable-all: true
    disable:
      - shadow
      - fieldalignment

  revive:
    rules:
      - name: exported
        disabled: false
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"

output:
  sort-results: true
